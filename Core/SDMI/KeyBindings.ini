namespace = SDMIv1

; Key Bindings -------------------------
; Note: with hunting=2 soft-off, F6 is free. When hunting is ON, d3dx.ini also
; uses F6 as mark_computeshader — toggle mods still works; prefer NumPad for CS mark.

[KeyToggleMods]
Key = no_modifiers F6
run = CommandListToggleMods

[KeyToggleUserGuide]
key = no_modifiers F12
type = cycle
$show_user_guide = 0,1


[KeyToggleHuntingModeGuide]
key = CTRL F12
type = cycle
$show_hunting_mode_guide = 0,1

[KeyHideFirstRunNotification]
Key = no_modifiers F10
condition = $first_run == 1
type = cycle
$first_run = 0,1
