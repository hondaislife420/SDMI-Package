namespace = shaderfixes\help.ini

; Legacy help.ini compatibility (same as HIMI/ZZMI). Prefer CommandListPrintText in main.ini.

[Constants]
global $notification_timeout = -1
run = CommandListInitialize

[CommandListInitialize]
ResourceFont = ref Resource\SDMIv1\Font

[Present]
if ResourceHelp !== null
	Resource\SDMIv1\Text = ref ResourceHelp
	if ResourceParams !== null
		Resource\SDMIv1\TextParams = ref ResourceParams
	else
		Resource\SDMIv1\TextParams = ref ResourceParamsShort
	endif
	run = CommandList\SDMIv1\PrintText
endif

if ResourceNotification !== null
	Resource\SDMIv1\Text = ref ResourceNotification
	if ResourceNotificationParams !== null
		Resource\SDMIv1\TextParams = ref ResourceNotificationParams
	else
		Resource\SDMIv1\TextParams = ref ResourceNotificationParamsDefault
	endif
	run = CommandList\SDMIv1\PrintText
	if time > $notification_timeout
		ResourceNotification = null
	endif
endif

[ResourceHelpFull]
[ResourceHelpShort]

[ResourceParamsFull]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.8 0.9 0.8 -1   1 0.7 0.15 1   0 0 0 0.75   0.01 0.01   1 1   0   1.0

[ResourceParamsShort]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.93 -0.9 +1 -0.9   1 0.7 0.15 1   0 0 0 0.75   0.01 0.01   1 3   1   1.0

[CustomShaderFormatText]
; Dummy — real implementation is in main.ini (avoids double-dispatch from legacy help)

