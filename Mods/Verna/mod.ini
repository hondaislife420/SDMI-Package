; -----------------------------------------------------------------------------

[ResourceBypassVB0]
[ResourceBypassIB]
[ResourceBypassVS_T3]
[ResourceBypassVS_T4]

[ResourceLivePosVB]
type = Buffer
stride = 12

[ResourceCustomPosRW]
type = RWBuffer
format = R32_FLOAT
array = 48180

; Game body vs-t4 / skin CS u0: 256960 bytes = 32120 x half4 (T and B per vert).
; VS loads t4[vid*2] and t4[vid*2+1]. Float32 UAV was 2x too large → blur/black.
[ResourceCustomTanRW]
type = RWBuffer
format = R16G16B16A16_FLOAT
array = 32120

; Free-N buffers (max 16384 verts). Only used when $verna_free_n=1
[ResourceCustomPosRWFree]
type = RWBuffer
format = R32_FLOAT
array = 49152

[ResourceCustomTanRWFree]
type = RWBuffer
format = R16G16B16A16_FLOAT
array = 32768

[ResourceJobBody]
type = Buffer
format = R32_UINT
filename = Meshes/Bones.params

[ResourceBones]
type = Buffer
format = R32G32B32A32_FLOAT
filename = Meshes/_free_n_backup/Bones-cs-t0=28cbf62a-cs=0d516b116c85c323.buf

[ResourceFaWeights]
type = Buffer
format = R32_UINT
filename = Meshes/weights.buf

; ONE rest file for inject + MultiJob + Test D
[ResourceFaRest]
type = Buffer
format = R32_FLOAT
filename = Meshes/rest.buf

[ResourceFaTans]
type = Buffer
format = R8G8B8A8_SNORM
filename = Meshes/tans.buf

; Game cs-t1 weights inject — use package Blend (same layout as FA weights)
[ResourceBlend]
type = Buffer
format = R32_UINT
filename = Meshes/_free_n_backup/Blend-cs-t1=9bff6d41-cs=0d516b116c85c323.buf

[ResourceTexCoord]
type = Buffer
format = R16G16_FLOAT
filename = Meshes/TexCoord.buf

[ResourceIndex]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = Meshes/Index.buf

[ResourceBodyDiffuse]
filename = Textures/body_diffuse.dds
[ResourceBodyPacked]
