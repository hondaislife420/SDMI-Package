namespace = Verna

[Constants]
; --- Free N (import_free_n.py / export --write-ini sets these) ---
global $verna_if_hair_a = 0
global $verna_ic_hair_a = 22962
global $verna_if_hair_b = 22962
global $verna_ic_hair_b = 7104
global $verna_if_legs = 0
global $verna_ic_legs = 0
global $verna_if_skin = 30066
global $verna_ic_skin = 28338
global $verna_if_fringe = 58404
global $verna_ic_fringe = 8580
global $verna_if_neck = 0
global $verna_ic_neck = 0
global $verna_if_body = 66984
global $verna_ic_body = 28692

; ======================================
global $verna_job = -1
; ======================================

[Present]
if $\SDMIv1\enable_mods
	$\SDMIv1\in_char_menu = 0
	run = CommandListMultiJobSkinFree
endif

; -----------------------------------------------------------------------------
; Skin CS — capture only while body rest t3 is bound (not face / other cages)
; -----------------------------------------------------------------------------

[ShaderOverrideVernaBodyBoneSeq]
hash = 0d516b116c85c323
checktextureoverride = cs-t1
if $\SDMIv1\enable_mods
	; Trigger on 6th dispatch once for Body CS
	if $verna_job == 6
		ResourceBones = copy cs-t0
		$verna_job = -1
	endif
	if $verna_job >= 0
		$verna_job = $verna_job+1
	endif
endif

; -----------------------------------------------------------------------------

[CustomShaderJobFree]
cs = MultiJob_Param.hlsl
cs-t1 = ResourceFaWeights
cs-t2 = ResourceFaTans
cs-t3 = ResourceFaRest
cs-u0 = ResourceCustomTanRWFree
cs-u1 = ResourceCustomPosRWFree
dispatch = 256, 1, 1

; -----------------------------------------------------------------------------

; Free-N MultiJob (max 16384 verts). job_*.params = base,count,wbase,pad
; dispatch 256 = 16384 threads; HLSL early-outs on count + MAX_VERTS
[CommandListMultiJobSkinFree]
cs-t0 = ResourceBones
cs-t5 = ResourceJobBody
run = CustomShaderJobFree

[CommandListVernaDrawBegin]
ResourceBypassVB0 = ref vb0
ResourceBypassIB = ref ib
ResourceBypassVS_T3 = ref vs-t3
ResourceBypassVS_T4 = ref vs-t4

; Because we copy the buffer to all characters that match the hash, replacing vb0 causes glitches in the character menu
ResourceLivePosVB = copy ResourceCustomPosRWFree
vb0 = ResourceLivePosVB
ib = ResourceIndex
vs-t3 = ResourceTexCoord
vs-t4 = ResourceCustomTanRWFree

handling = skip

[CommandListVernaDrawEnd]
vb0 = ref ResourceBypassVB0
ib = ref ResourceBypassIB
vs-t3 = ref ResourceBypassVS_T3
vs-t4 = ref ResourceBypassVS_T4

; -----------------------------------------------------------------------------

[TextureOverrideVernaBodyWeights]
hash = 9bff6d41
if $\SDMIv1\enable_mods
	this = ResourceBlend
	$verna_job = 0
endif

[TextureOverrideHairA]
hash = e33d5bc8
match_first_index = 0
match_index_count = 15168
if $\SDMIv1\enable_mods && !$\SDMIv1\in_char_menu
	ps-t6 = ResourceHairNormal
	ps-t7 = ResourceHairDiffuse
	ps-t8 = ResourceHairMask

	run = CommandListVernaDrawBegin
	drawindexed = $verna_ic_hair_a, $verna_if_hair_a, 0
	run = CommandListVernaDrawEnd
endif

[TextureOverrideHairB]
hash = e33d5bc8
match_first_index = 15168
